repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: Pyright type check
        entry: uv run --no-sync pyright --project pyproject.toml
        language: system
        pass_filenames: false
        types_or: [python, pyi]
